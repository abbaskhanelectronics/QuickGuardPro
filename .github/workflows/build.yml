name: Build Quick Guard Pro APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Firebase config files
        run: |
          for m in admin device; do
            if [ ! -f "$m/google-services.json" ]; then
              echo "::error::$m/google-services.json is missing. Download it from Firebase Console (project quick-guard-pro) and upload it to the $m folder."
              exit 1
            fi
          done

      - name: Prepare release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Warn if no signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No KEYSTORE_BASE64 secret — APKs are debug-signed. QR enrollment and app updates need the real key."

      - name: Build release APKs
        run: gradle :admin:assembleRelease :device:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp admin/build/outputs/apk/release/*.apk out/QuickGuardPro-Admin.apk
          cp device/build/outputs/apk/release/*.apk out/QuickGuardPro-Device.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: QuickGuardPro-APKs
          path: out/*.apk

      - name: Publish release (stable download link for QR enrollment)
        if: env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Quick Guard Pro 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/QuickGuardPro-Admin.apk
            out/QuickGuardPro-Device.apk
